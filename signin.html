<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign-In</title>
    <link rel="stylesheet" href="signin.css">
</head>

<body>
    <div class="container">
        <div class="logo">
           <a href="/home.html"><img src="./Images/amazon logo 2.png" alt="amazon logo"></a> 
        </div>

        <div class="sign-in-box">
            <h1>Sign In</h1>
            <form action="#" method="get">
                <label for="email"><b>Email or mobile phone number</b></label>

                <input type="text" id="email" name="email" required>

                <button type="submit">Continue</button>

                <p class="notice">By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a
                        href="#">Privacy Notice.</a></p>

                <p class="help"><a href="#">Need help?</a></p>

                <div class="divider"></div>

                <h5>Buying for work?</h5>
                <p class="shop"><a href="#">Shop on Amazon Business</a></p>
                <div class="divider"></div>
                <div class="create-account">
                    <h2>New to Amazon?</h2>
                </div>
                <button class="create-button"><a href="registration.html">Create your Amazon account</a></button>
            </form>

        </div><br>
        
        <div class="bottom-links">
           <a href="#">Conditions of Use</a>
           <a href="#">Privacy of Notice</a>
           <a href="#">Help</a>
           <span>@ 1996-2024, Amazon.com, Inc. or its affiliates</span>
        </div>
    </div>
    <!-- <div class="divider"></div> -->


</body>

</html>
