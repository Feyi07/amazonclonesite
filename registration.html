<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Registration</title>
    <link rel="stylesheet" href="registration.css">
</head>

<body>
    <div class="container">
        <div class="logo">
           <a href="/home.html"><img src="./Images/amazon logo 2.png" alt="amazon-logo-"></a> 
        </div>
        <div class="create-account-box">
            <h1>Create Account</h1>
            <form action="#">
                <label for="name"><b>Your name</b></label>
                <input type="text" id="name" name="name" placeholder="First and last name" required><br>
               <label for="email"><b>Mobile number or email</b></label>
                <input type="email" id="email" name="email" required><br>
                <label for="password"><b>Password</b></label>
                <input type="password" id="password" name="password" required><br>
                <p class="password-hint">Passwords must be at least 6 characters.</p>
                <label for="password-check"><b>Re-enter password</b></label>
                <input type="password" id="password-check" name="password-check" required>
                <button type="submit"><b>Continue</b></button>
                <p class="terms">
                    By creating account, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>
                </p>
                <div class="divider"></div>
                <div class="business">
                    <p class="buy">Buying for work?</p>
                    <a href="#">Create a free business account</a>
                </div>
            </form>
            <div class="divider"></div>
            <p class="signin-link">Already have an account?<a href="signin.html">Sign in</a></p>
        </div>
    </div>
</body>

</html>
